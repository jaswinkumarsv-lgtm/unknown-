<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14172a">
<title>IKS MCQ Practice</title>
<style>
:root{
  --bg:#14172a; --panel:#1c2038; --panel2:#242946; --line:#323860; --text:#eceaf6; --muted:#9a9cc0;
  --accent:#f2b441; --ok:#2fbf71; --okbg:rgba(47,191,113,.16); --bad:#ef5350; --badbg:rgba(239,83,80,.16);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
header.top{padding:18px 16px 8px;max-width:860px;margin:0 auto}
header.top h1{margin:0;font:700 1.45rem/1.2 Georgia,"Times New Roman",serif;letter-spacing:.2px}
header.top p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
#chips{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:8px 16px 10px;
  display:flex;gap:8px;overflow-x:auto;max-width:860px;margin:0 auto;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:54px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  font-weight:600;font-size:.92rem;background-image:linear-gradient(90deg,rgba(242,180,65,.28) var(--p,0%),transparent var(--p,0%))}
.chip.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.chip.done{border-color:var(--ok)}
main{max-width:860px;margin:0 auto;padding:6px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.topic-head h2{margin:0 0 2px;font:700 1.2rem/1.3 Georgia,"Times New Roman",serif}
.topic-head .sub{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:10px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:1.25rem;line-height:1.2}
.stat span{font-size:.72rem;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.acc b{color:var(--accent)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.overall{font-size:.82rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:.88rem}
.btn:active{transform:scale(.97)}
.btn.warn{border-color:rgba(239,83,80,.6);color:#ff8e8b}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#2a1d00}
details.prog{margin-top:12px}
details.prog summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:7px 0;border:0;background:none;width:100%;text-align:left}
.prow .bar{margin:0}.prow small{color:var(--muted);font-size:.75rem;white-space:nowrap}
#qlist{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.q.is-ok{border-color:rgba(47,191,113,.55)} .q.is-bad{border-color:rgba(239,83,80,.55)}
.qtext{margin:0 0 10px;font-weight:600}
.qtext em{font-style:normal;color:var(--accent);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);transition:background .15s,border-color .15s}
.opt .l{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--bg);color:var(--muted)}
.opt:not(.locked):hover{border-color:var(--accent)}
.opt.locked{cursor:default}
.opt.locked:not(.correct):not(.wrong){opacity:.55}
.opt.correct{background:var(--okbg);border-color:var(--ok)} .opt.correct .l{background:var(--ok);color:#06210f}
.opt.wrong{background:var(--badbg);border-color:var(--bad)} .opt.wrong .l{background:var(--bad);color:#2a0807}
.opt.correct::after{content:"\2713";margin-left:auto;color:var(--ok);font-weight:700}
.opt.wrong::after{content:"\2717";margin-left:auto;color:var(--bad);font-weight:700}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;min-height:34px}
.fb{font-size:.86rem;color:var(--muted)} .fb.ok{color:var(--ok)} .fb.bad{color:#ff8e8b}
.qreset{padding:6px 12px;font-size:.8rem;opacity:.45}
.q.answered .qreset{opacity:1}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;text-align:center}
.err{padding:30px 16px;text-align:center;color:#ff8e8b}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:700px){.stat b{font-size:1.5rem}.qtext{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <h1>IKS MCQ Practice</h1>
  <p>Ancient Indian Knowledge Systems &middot; pick a topic, tap an answer</p>
</header>
<nav id="chips" aria-label="Topics"></nav>
<main id="app"></main>
<footer><button class="btn warn" id="resetAll">Reset Everything</button></footer>

<script src="questions.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var D = window.IKS_DATA;
  if (!D || !D.topics || !D.topics.length) {
    app.innerHTML = '<div class="err">Could not load questions.js. Keep index.html and questions.js in the same folder.</div>';
    return;
  }
  var KEY = 'iks-mcq-v1', LETTERS = ['A', 'B', 'C', 'D'];
  var S = { answers: {}, topic: D.topics[0].id };
  var cards = {}, chipEls = {}, ui = {};

  function topicById(id) { for (var i = 0; i < D.topics.length; i++) if (D.topics[i].id === id) return D.topics[i]; return null; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---- storage (safe if blocked) ----
  var valid = {};
  D.topics.forEach(function (t) { t.questions.forEach(function (q) { valid[q.id] = true; }); });
  function load() {
    try {
      var r = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (r && r.answers) for (var k in r.answers) if (valid[k] && LETTERS.indexOf(r.answers[k]) > -1) S.answers[k] = r.answers[k];
      if (r && topicById(r.topic)) S.topic = r.topic;
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // ---- stats ----
  function stat(qs) {
    var a = 0, c = 0;
    qs.forEach(function (q) { var x = S.answers[q.id]; if (x) { a++; if (x === q.answer) c++; } });
    return { total: qs.length, attempted: a, correct: c, acc: a ? Math.round(c * 100 / a) : 0 };
  }
  function allQs() { var r = []; D.topics.forEach(function (t) { r = r.concat(t.questions); }); return r; }

  // ---- card state ----
  function paintCard(q) {
    var c = cards[q.id]; if (!c) return;
    var ch = S.answers[q.id];
    c.root.className = 'q' + (ch ? ' answered ' + (ch === q.answer ? 'is-ok' : 'is-bad') : '');
    c.btns.forEach(function (b, i) {
      var L = LETTERS[i];
      b.className = 'opt' + (ch ? ' locked' : '') + (ch && L === q.answer ? ' correct' : '') + (ch && L === ch && L !== q.answer ? ' wrong' : '');
      b.setAttribute('aria-disabled', ch ? 'true' : 'false');
    });
    if (!ch) { c.fb.className = 'fb'; c.fb.textContent = 'Tap an option to answer'; }
    else if (ch === q.answer) { c.fb.className = 'fb ok'; c.fb.textContent = 'Correct'; }
    else { c.fb.className = 'fb bad'; c.fb.textContent = 'Incorrect. Correct answer: (' + q.answer + ')'; }
  }

  function updateStats() {
    var t = topicById(S.topic), s = stat(t.questions), o = stat(allQs());
    ui.total.textContent = s.total; ui.att.textContent = s.attempted; ui.cor.textContent = s.correct; ui.acc.textContent = s.acc + '%';
    ui.bar.style.width = (s.total ? s.attempted * 100 / s.total : 0) + '%';
    ui.overall.textContent = 'All topics: ' + o.attempted + ' of ' + o.total + ' attempted \u00b7 ' + o.correct + ' correct \u00b7 ' + o.acc + '% accuracy';
    D.topics.forEach(function (tp) {
      var x = stat(tp.questions), p = tp.questions.length ? x.attempted * 100 / tp.questions.length : 0;
      var ce = chipEls[tp.id];
      ce.style.setProperty('--p', p + '%');
      ce.className = 'chip' + (tp.id === S.topic ? ' active' : '') + (x.attempted === x.total ? ' done' : '');
      var pr = ui.rows[tp.id];
      pr.bar.style.width = p + '%'; pr.txt.textContent = x.attempted + '/' + x.total + ' \u00b7 ' + x.correct + ' correct';
    });
  }

  // ---- actions ----
  function answer(q, letter) {
    if (S.answers[q.id]) return;           // locked: no accidental second answer
    S.answers[q.id] = letter; save(); paintCard(q); updateStats();
  }
  function resetQ(q) { delete S.answers[q.id]; save(); paintCard(q); updateStats(); }
  function resetTopic() {
    var t = topicById(S.topic);
    if (!confirm('Reset all answers in ' + t.id + '?')) return;
    t.questions.forEach(function (q) { delete S.answers[q.id]; paintCard(q); });
    save(); updateStats();
  }
  function resetAll() {
    if (!confirm('Reset ALL answers in ALL topics? This cannot be undone.')) return;
    S.answers = {}; save();
    topicById(S.topic).questions.forEach(paintCard); updateStats();
  }

  // ---- build UI ----
  function buildQuestion(q) {
    var root = el('article', 'q'), btns = [];
    var p = el('p', 'qtext'); p.appendChild(el('em', null, 'Q' + q.id)); p.appendChild(document.createTextNode(q.q)); root.appendChild(p);
    var opts = el('div', 'opts');
    q.options.forEach(function (text, i) {
      var b = el('button', 'opt'); b.type = 'button';
      b.appendChild(el('span', 'l', LETTERS[i])); b.appendChild(el('span', null, text));
      b.addEventListener('click', function () { answer(q, LETTERS[i]); });
      opts.appendChild(b); btns.push(b);
    });
    root.appendChild(opts);
    var foot = el('div', 'qfoot'), fb = el('span', 'fb'); fb.setAttribute('aria-live', 'polite');
    var rb = el('button', 'btn qreset', 'Reset'); rb.type = 'button';
    rb.addEventListener('click', function () { resetQ(q); });
    foot.appendChild(fb); foot.appendChild(rb); root.appendChild(foot);
    cards[q.id] = { root: root, btns: btns, fb: fb };
    return root;
  }

  function showTopic(id, scroll) {
    var t = topicById(id) || D.topics[0], idx = D.topics.indexOf(t);
    S.topic = t.id; save(); cards = {};
    ui.h2.textContent = t.id + ' \u00b7 ' + t.title;
    ui.sub.textContent = 'Lesson ' + t.lesson + ' \u00b7 ' + t.questions.length + ' questions';
    ui.list.innerHTML = '';
    t.questions.forEach(function (q) { ui.list.appendChild(buildQuestion(q)); paintCard(q); });
    var nav = el('div', 'nav');
    var prev = el('button', 'btn', idx > 0 ? '\u2190 ' + D.topics[idx - 1].id : ''), next = el('button', 'btn solid', idx < D.topics.length - 1 ? D.topics[idx + 1].id + ' \u2192' : '');
    prev.type = next.type = 'button';
    if (idx > 0) prev.addEventListener('click', function () { showTopic(D.topics[idx - 1].id, true); }); else prev.style.visibility = 'hidden';
    if (idx < D.topics.length - 1) next.addEventListener('click', function () { showTopic(D.topics[idx + 1].id, true); }); else next.style.visibility = 'hidden';
    nav.appendChild(prev); nav.appendChild(next); ui.list.appendChild(nav);
    updateStats();
    try { history.replaceState(null, '', '#' + t.id); } catch (e) {}
    chipEls[t.id].scrollIntoView({ inline: 'center', block: 'nearest' });
    if (scroll) window.scrollTo(0, 0);
  }

  function build() {
    var chips = document.getElementById('chips');
    D.topics.forEach(function (t) {
      var b = el('button', 'chip', t.id); b.type = 'button'; b.title = t.title;
      b.addEventListener('click', function () { showTopic(t.id, true); });
      chips.appendChild(b); chipEls[t.id] = b;
    });
    var head = el('section', 'card topic-head');
    ui.h2 = el('h2'); ui.sub = el('div', 'sub'); head.appendChild(ui.h2); head.appendChild(ui.sub);
    var grid = el('div', 'stats');
    function mk(label, cls) { var s = el('div', 'stat ' + (cls || '')), b = el('b', null, '0'); s.appendChild(b); s.appendChild(el('span', null, label)); grid.appendChild(s); return b; }
    ui.total = mk('Total'); ui.att = mk('Attempted'); ui.cor = mk('Correct', 'ok'); ui.acc = mk('Accuracy', 'acc');
    head.appendChild(grid);
    var bar = el('div', 'bar'); ui.bar = el('i'); bar.appendChild(ui.bar); head.appendChild(bar);
    ui.overall = el('div', 'overall'); head.appendChild(ui.overall);
    var act = el('div', 'actions'), rt = el('button', 'btn warn', 'Reset Topic'), ra = el('button', 'btn warn', 'Reset Everything');
    rt.type = ra.type = 'button'; rt.addEventListener('click', resetTopic); ra.addEventListener('click', resetAll);
    act.appendChild(rt); act.appendChild(ra); head.appendChild(act);
    var det = el('details', 'prog'); det.appendChild(el('summary', null, 'Topic-wise progress'));
    ui.rows = {};
    D.topics.forEach(function (t) {
      var r = el('button', 'prow'); r.type = 'button'; r.title = t.title;
      var bw = el('div', 'bar'), bi = el('i'), tx = el('small');
      bw.appendChild(bi); r.appendChild(el('b', null, t.id)); r.appendChild(bw); r.appendChild(tx);
      r.addEventListener('click', function () { showTopic(t.id, true); });
      det.appendChild(r); ui.rows[t.id] = { bar: bi, txt: tx };
    });
    head.appendChild(det);
    app.appendChild(head);
    ui.list = el('div'); ui.list.id = 'qlist'; app.appendChild(ui.list);
    document.getElementById('resetAll').addEventListener('click', resetAll);
  }

  load(); build();
  var hash = (location.hash || '').replace('#', '');
  showTopic(topicById(hash) ? hash : S.topic, false);
})();
</script>
</body>
</html>
